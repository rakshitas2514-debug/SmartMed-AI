{% extends "base.html" %}{% block title %}Log in · SmartMed AI{% endblock %}
{% block content %}<section class="auth-card"><div class="eyebrow">WELCOME BACK</div><h1>Log in</h1><form method="post" class="form-stack">
<label>Email<input name="email" type="email" required autocomplete="email"></label>
<label>Password<input name="password" type="password" required autocomplete="current-password"></label>
<button class="button" type="submit">Log in</button></form><p>New here? <a href="{{ url_for('register') }}">Create an account</a></p></section>{% endblock %}
