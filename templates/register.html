{% extends "base.html" %}{% block title %}Create account · SmartMed AI{% endblock %}
{% block content %}<section class="auth-card"><div class="eyebrow">GET STARTED</div><h1>Create your account</h1><p class="muted">Your activity is saved locally in this app's SQLite database.</p>
<form method="post" class="form-stack">
<label>Username<input name="username" required minlength="2" autocomplete="username"></label>
<label>Email<input name="email" type="email" required autocomplete="email"></label>
<label>Password<input name="password" type="password" required minlength="8" autocomplete="new-password"><small>Use at least 8 characters.</small></label>
<button class="button" type="submit">Create account</button></form><p>Already registered? <a href="{{ url_for('login') }}">Log in</a></p></section>{% endblock %}
